services:
  - type: web
    name: productiq
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300 app:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: PRODUCTIQ_REQUEST_DELAY
        value: "2.5"
      - key: PRODUCTIQ_MAX_BATCH
        value: "25"
